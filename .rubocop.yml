---
AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: true
  Exclude:
    - _snippets/**/*

plugins:
  - rubocop-performance

Metrics/BlockLength:
  Enabled: true
  Exclude:
    - spec/**/* # Minitest/test scaffolding requires large blocks
    - Rakefile  # Rake namespaces produce large blocks
    - app/controllers/*.rb # Roda's nested controllers require large blocks

Style/HashSyntax:
  Enabled: true
  Exclude:
    - Rakefile

# Method arguments continue one indent step (2 spaces) below the call line,
# rather than aligning all the way out to the first argument
Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation

# Chained calls continue one indent step (2 spaces) below the previous line,
# rather than aligning all the way out to the first call point
Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented
