---
# Rename file to secrets.yml to get started for development or test

# Redis URL: set ONE of REDISCLOUD_URL or REDIS_URL, depending on which
# add-on you've provisioned. Redis Cloud (`rediscloud:30`, free tier)
# exposes REDISCLOUD_URL; Heroku Redis (`heroku-redis:mini` and up)
# exposes REDIS_URL. Code reads whichever is non-nil (Redis Cloud first).

# SIGNING_KEY: private Ed25519 key for signing non-authenticated API
# requests (generate keypairs with `rake newkey:signing` in the API repo).
# The private half lives ONLY here; the API gets just the public VERIFY_KEY,
# so it can verify but never sign. Per-environment topology:
#   development -- signing half of the dev keypair (API dev holds verify half)
#   test       -- this app's own throwaway key (WebMock only compares bodies)
#   production -- generated at deploy time; never leaves this app's config

# GOOGLE_*: "Sign in with Google" (OIDC). The App holds BOTH the client id
# and secret (it runs the OAuth code->token exchange). The redirect URI must
# match a value registered in the Google Console byte-for-byte. See
# WALKTHROUGH.google-oauth-setup.md in the baby_tyto planning repo.

development:
  API_URL: http://localhost:3000/api/v1
  APP_URL: http://localhost:9292
  SESSION_SECRET: <`rake generate:session_secret`>
  MSG_KEY: <`rake newkey:msg`>
  SIGNING_KEY: <signing half of dev keypair from API repo `rake newkey:signing`>
  REDISCLOUD_URL: redis://localhost:6379/0
  # REDIS_URL: redis://localhost:6379/0
  GOOGLE_CLIENT_ID: <Google OAuth client id, type Web application>
  GOOGLE_CLIENT_SECRET: <Google OAuth client secret>
  GOOGLE_OAUTH_URL: https://accounts.google.com/o/oauth2/v2/auth
  GOOGLE_TOKEN_URL: https://oauth2.googleapis.com/token
  GOOGLE_SCOPE: openid email profile
  GOOGLE_REDIRECT_URI: http://localhost:9292/auth/sso_callback

test:
  API_URL: http://localhost:3000/api/v1
  APP_URL: http://localhost:9292
  SESSION_SECRET: <`rake generate:session_secret`>
  MSG_KEY: <`rake newkey:msg`>
  SIGNING_KEY: <own throwaway key from API repo `rake newkey:signing`>
  REDISCLOUD_URL: redis://localhost:6379/0
  # REDIS_URL: redis://localhost:6379/0
  GOOGLE_CLIENT_ID: test-client-id.apps.googleusercontent.com
  GOOGLE_CLIENT_SECRET: test-client-secret
  GOOGLE_OAUTH_URL: https://accounts.google.com/o/oauth2/v2/auth
  GOOGLE_TOKEN_URL: https://oauth2.googleapis.com/token
  GOOGLE_SCOPE: openid email profile
  GOOGLE_REDIRECT_URI: http://localhost:9292/auth/sso_callback

production:
  API_URL: <provisioned API URL (ending with /api/v1)>
  APP_URL: <provisioned app URL (root without trailing slash)>
  SESSION_SECRET: <`rake generate:session_secret`>
  MSG_KEY: <`rake newkey:msg`>
  SIGNING_KEY: <generated at deploy time; private half lives only in this app>
  REDISCLOUD_URL: <set by `rediscloud` add-on>
  # REDIS_URL: <set by `heroku-redis` add-on>
  GOOGLE_CLIENT_ID: <Google OAuth client id, type Web application>
  GOOGLE_CLIENT_SECRET: <Google OAuth client secret>
  GOOGLE_OAUTH_URL: https://accounts.google.com/o/oauth2/v2/auth
  GOOGLE_TOKEN_URL: https://oauth2.googleapis.com/token
  GOOGLE_SCOPE: openid email profile
  GOOGLE_REDIRECT_URI: <APP_URL>/auth/sso_callback
